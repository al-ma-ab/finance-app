spring:
  application:
    name: finance-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance_app}
    username: ${DB_USERNAME:finance_user}
    password: ${DB_PASSWORD:finance_pass}
    driverClassName: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

